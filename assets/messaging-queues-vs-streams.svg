<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Message queue vs event stream</title>
<desc>Shows a queue where a message is consumed by exactly one worker and removed, versus a stream where multiple independent consumers each read the same durable log at their own position.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.th{font-size:14px;font-weight:600;}
.ts{font-size:12px;fill:#B4B4B4;}
.box{stroke-width:1;}
.teal{fill:#173829;stroke:#4CAF8C;}
.purple{fill:#241E3D;stroke:#8C7DE0;}
.boxlabel{font-size:14px;font-weight:600;fill:#F5F5F5;}
.boxsub{font-size:12px;fill:#D0D0D0;}
line{stroke:#9CA3AF;stroke-width:1.5;marker-end:url(#arrow);}
</style>
<rect x="0" y="0" width="680" height="400" fill="#0D1117"/>

<text class="th" x="340" y="30" text-anchor="middle">Queue — one consumer, message removed after read</text>
<rect class="box purple" x="40" y="55" width="120" height="46" rx="8"/>
<text class="boxlabel" x="100" y="78" text-anchor="middle" dominant-baseline="central">Producer</text>
<line x1="160" y1="78" x2="240" y2="78"/>
<rect class="box purple" x="240" y="55" width="140" height="46" rx="8"/>
<text class="boxlabel" x="310" y="78" text-anchor="middle" dominant-baseline="central">Queue</text>
<line x1="380" y1="78" x2="460" y2="78"/>
<rect class="box teal" x="460" y="55" width="170" height="46" rx="8"/>
<text class="boxlabel" x="545" y="72" text-anchor="middle" dominant-baseline="central">Worker A</text>
<text class="boxsub" x="545" y="88" text-anchor="middle" dominant-baseline="central">consumes, message gone</text>

<line x1="40" y1="140" x2="640" y2="140" stroke="#30363D" stroke-width="1"/>

<text class="th" x="340" y="165" text-anchor="middle">Stream — durable log, multiple independent readers</text>
<rect class="box purple" x="40" y="190" width="120" height="46" rx="8"/>
<text class="boxlabel" x="100" y="213" text-anchor="middle" dominant-baseline="central">Producer</text>
<line x1="160" y1="213" x2="240" y2="213"/>
<rect class="box purple" x="240" y="185" width="150" height="140" rx="8"/>
<text class="boxlabel" x="315" y="205" text-anchor="middle" dominant-baseline="central">Log (retained)</text>
<rect x="255" y="220" width="30" height="20" fill="#4CAF8C" rx="3"/>
<rect x="290" y="220" width="30" height="20" fill="#4CAF8C" rx="3"/>
<rect x="325" y="220" width="30" height="20" fill="#4CAF8C" rx="3"/>
<text class="ts" x="315" y="255" text-anchor="middle">events 1,2,3...</text>
<text class="ts" x="315" y="275" text-anchor="middle">each consumer</text>
<text class="ts" x="315" y="290" text-anchor="middle">tracks own offset</text>

<line x1="390" y1="200" x2="460" y2="200"/>
<rect class="box teal" x="460" y="177" width="170" height="42" rx="8"/>
<text class="boxlabel" x="545" y="192" text-anchor="middle" dominant-baseline="central">Consumer: Inventory</text>
<text class="boxsub" x="545" y="207" text-anchor="middle" dominant-baseline="central">offset 3</text>

<line x1="390" y1="245" x2="460" y2="245"/>
<rect class="box teal" x="460" y="222" width="170" height="42" rx="8"/>
<text class="boxlabel" x="545" y="237" text-anchor="middle" dominant-baseline="central">Consumer: Fraud check</text>
<text class="boxsub" x="545" y="252" text-anchor="middle" dominant-baseline="central">offset 2 (behind)</text>

<line x1="390" y1="290" x2="460" y2="290"/>
<rect class="box teal" x="460" y="267" width="170" height="42" rx="8"/>
<text class="boxlabel" x="545" y="282" text-anchor="middle" dominant-baseline="central">Consumer: Analytics</text>
<text class="boxsub" x="545" y="297" text-anchor="middle" dominant-baseline="central">offset 3</text>

<text class="ts" x="340" y="360" text-anchor="middle">Each consumer reads the same log independently — no consumer removes events for another</text>
</svg>
