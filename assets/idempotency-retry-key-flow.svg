<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Idempotency key flow for payment retries</title>
<desc>Shows a client making a request that times out, retrying with the same idempotency key, and the server returning a cached result on the second attempt instead of reprocessing.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.th{font-size:14px;font-weight:600;}
.ts{font-size:12px;fill:#B4B4B4;}
.box{stroke-width:1;}
.problem{fill:#3A1E1E;stroke:#D97070;}
.fix{fill:#173829;stroke:#4CAF8C;}
.boxlabel{font-size:14px;font-weight:600;fill:#F5F5F5;}
.boxsub{font-size:12px;fill:#D0D0D0;}
line{stroke:#9CA3AF;stroke-width:1.5;marker-end:url(#arrow);}
</style>

<rect x="0" y="0" width="680" height="480" fill="#0D1117"/>

<text class="th" x="340" y="30" text-anchor="middle">Without vs with an idempotency key</text>

<rect class="box problem" x="60" y="60" width="150" height="44" rx="8"/>
<text class="boxlabel" x="135" y="82" text-anchor="middle" dominant-baseline="central">Client</text>
<line x1="210" y1="82" x2="290" y2="82"/>
<text class="ts" x="250" y="70" text-anchor="middle">Request 1</text>
<rect class="box problem" x="290" y="60" width="150" height="44" rx="8"/>
<text class="boxlabel" x="365" y="82" text-anchor="middle" dominant-baseline="central">Server</text>
<text class="ts" x="510" y="70" text-anchor="middle">Processed,</text>
<text class="ts" x="510" y="84" text-anchor="middle">response lost</text>

<line x1="135" y1="104" x2="135" y2="150"/>
<text class="ts" x="135" y="130" text-anchor="middle">Timeout</text>
<rect class="box problem" x="60" y="150" width="150" height="44" rx="8"/>
<text class="boxlabel" x="135" y="172" text-anchor="middle" dominant-baseline="central">Client retries</text>
<line x1="210" y1="172" x2="290" y2="172"/>
<text class="ts" x="250" y="160" text-anchor="middle">Request 2</text>
<rect class="box problem" x="290" y="150" width="150" height="44" rx="8"/>
<text class="boxlabel" x="365" y="172" text-anchor="middle" dominant-baseline="central">Server</text>
<text class="ts" x="510" y="160" text-anchor="middle">Processed</text>
<text class="ts" x="510" y="174" text-anchor="middle">again — charged 2x</text>

<line x1="40" y1="215" x2="640" y2="215" stroke="#30363D" stroke-width="1" style="marker-end:none;"/>

<text class="th" x="340" y="245" text-anchor="middle">With an idempotency key</text>

<rect class="box fix" x="60" y="270" width="150" height="56" rx="8"/>
<text class="boxlabel" x="135" y="288" text-anchor="middle" dominant-baseline="central">Client</text>
<text class="boxsub" x="135" y="306" text-anchor="middle" dominant-baseline="central">key: abc123</text>
<line x1="210" y1="298" x2="290" y2="298"/>
<rect class="box fix" x="290" y="270" width="150" height="56" rx="8"/>
<text class="boxlabel" x="365" y="288" text-anchor="middle" dominant-baseline="central">Server</text>
<text class="boxsub" x="365" y="306" text-anchor="middle" dominant-baseline="central">new key → process</text>
<rect class="box fix" x="480" y="270" width="150" height="56" rx="8"/>
<text class="boxlabel" x="555" y="288" text-anchor="middle" dominant-baseline="central">Key store</text>
<text class="boxsub" x="555" y="306" text-anchor="middle" dominant-baseline="central">abc123 → result</text>
<line x1="440" y1="298" x2="478" y2="298"/>

<line x1="135" y1="326" x2="135" y2="372"/>
<text class="ts" x="135" y="352" text-anchor="middle">Timeout, retries</text>
<rect class="box fix" x="60" y="372" width="150" height="56" rx="8"/>
<text class="boxlabel" x="135" y="390" text-anchor="middle" dominant-baseline="central">Client</text>
<text class="boxsub" x="135" y="408" text-anchor="middle" dominant-baseline="central">same key: abc123</text>
<line x1="210" y1="400" x2="290" y2="400"/>
<rect class="box fix" x="290" y="372" width="150" height="56" rx="8"/>
<text class="boxlabel" x="365" y="390" text-anchor="middle" dominant-baseline="central">Server</text>
<text class="boxsub" x="365" y="408" text-anchor="middle" dominant-baseline="central">lookup, no reprocess</text>
<line x1="440" y1="400" x2="478" y2="330"/>
</svg>
