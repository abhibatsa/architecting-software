<svg width="760" height="420" viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Relational normalized tables vs NoSQL denormalized document</title>
<desc>Shows a relational model as three normalized tables joined by foreign keys, versus a NoSQL model as a single denormalized document containing all the same data pre-shaped for one read query, followed by a decision guide based on whether access patterns are known and stable.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.th{font-size:14px;font-weight:600;}
.ts{font-size:11px;fill:#B4B4B4;}
.box{stroke-width:1;}
.teal{fill:#173829;stroke:#4CAF8C;}
.purple{fill:#241E3D;stroke:#8C7DE0;}
.amber{fill:#3A2A10;stroke:#E0A33D;}
.boxlabel{font-size:12px;font-weight:600;fill:#F5F5F5;}
.boxsub{font-size:10px;fill:#D0D0D0;}
line{stroke:#9CA3AF;stroke-width:1.5;}
.joinline{stroke:#8C7DE0;stroke-width:1.5;stroke-dasharray:4,3;marker-end:none;}
</style>
<rect x="0" y="0" width="760" height="420" fill="#0D1117"/>

<text class="th" x="195" y="26" text-anchor="middle">Relational — normalized, joined at read time</text>
<rect class="box purple" x="30" y="45" width="130" height="60" rx="8"/>
<text class="boxlabel" x="95" y="62" text-anchor="middle" dominant-baseline="central">users</text>
<text class="boxsub" x="95" y="78" text-anchor="middle" dominant-baseline="central">id, name, email</text>
<text class="boxsub" x="95" y="92" text-anchor="middle" dominant-baseline="central">PK: id</text>

<rect class="box purple" x="180" y="45" width="150" height="60" rx="8"/>
<text class="boxlabel" x="255" y="62" text-anchor="middle" dominant-baseline="central">orders</text>
<text class="boxsub" x="255" y="78" text-anchor="middle" dominant-baseline="central">id, user_id, total</text>
<text class="boxsub" x="255" y="92" text-anchor="middle" dominant-baseline="central">FK: user_id → users</text>

<rect class="box purple" x="30" y="130" width="150" height="60" rx="8"/>
<text class="boxlabel" x="105" y="147" text-anchor="middle" dominant-baseline="central">order_items</text>
<text class="boxsub" x="105" y="163" text-anchor="middle" dominant-baseline="central">id, order_id, sku</text>
<text class="boxsub" x="105" y="177" text-anchor="middle" dominant-baseline="central">FK: order_id → orders</text>

<line class="joinline" x1="95" y1="105" x2="240" y2="130"/>
<line class="joinline" x1="255" y1="105" x2="105" y2="130"/>
<text class="ts" x="175" y="210" text-anchor="middle">3 joins to render one order page</text>

<line x1="380" y1="120" x2="430" y2="120" stroke="#30363D"/>

<text class="th" x="565" y="26" text-anchor="middle">NoSQL — denormalized, shaped for the read</text>
<rect class="box teal" x="440" y="45" width="280" height="180" rx="8"/>
<text class="boxlabel" x="580" y="65" text-anchor="middle" dominant-baseline="central">order document</text>
<text class="boxsub" x="580" y="85" text-anchor="middle" dominant-baseline="central">{ id, total,</text>
<text class="boxsub" x="580" y="100" text-anchor="middle" dominant-baseline="central">  user: { name, email },</text>
<text class="boxsub" x="580" y="115" text-anchor="middle" dominant-baseline="central">  items: [</text>
<text class="boxsub" x="580" y="130" text-anchor="middle" dominant-baseline="central">    { sku, qty, price },</text>
<text class="boxsub" x="580" y="145" text-anchor="middle" dominant-baseline="central">    { sku, qty, price }</text>
<text class="boxsub" x="580" y="160" text-anchor="middle" dominant-baseline="central">  ]</text>
<text class="boxsub" x="580" y="175" text-anchor="middle" dominant-baseline="central">}</text>
<text class="ts" x="580" y="205" text-anchor="middle">one read, no joins</text>

<line x1="30" y1="245" x2="730" y2="245" stroke="#30363D" stroke-width="1"/>

<text class="th" x="380" y="270" text-anchor="middle">Decision guide</text>
<rect class="box amber" x="260" y="290" width="240" height="46" rx="8"/>
<text class="boxlabel" x="380" y="307" text-anchor="middle" dominant-baseline="central">Are access patterns</text>
<text class="boxlabel" x="380" y="323" text-anchor="middle" dominant-baseline="central">known and stable?</text>

<line x1="310" y1="336" x2="210" y2="370" marker-end="url(#arrow)"/>
<text class="ts" x="230" y="358" text-anchor="middle">No</text>
<rect class="box purple" x="90" y="370" width="240" height="40" rx="8"/>
<text class="boxlabel" x="210" y="390" text-anchor="middle" dominant-baseline="central">Relational — keep flexibility</text>

<line x1="450" y1="336" x2="550" y2="370" marker-end="url(#arrow)"/>
<text class="ts" x="530" y="358" text-anchor="middle">Yes</text>
<rect class="box teal" x="430" y="370" width="240" height="40" rx="8"/>
<text class="boxlabel" x="550" y="390" text-anchor="middle" dominant-baseline="central">NoSQL — model for the read</text>
</svg>
