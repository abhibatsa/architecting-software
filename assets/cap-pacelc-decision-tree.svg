<svg width="700" height="420" viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>PACELC decision tree</title>
<desc>Shows the PACELC framework as a decision tree: during a network partition, choose between availability and consistency; otherwise, during normal operation, choose between latency and consistency.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.th{font-size:14px;font-weight:600;}
.ts{font-size:12px;fill:#B4B4B4;}
.box{stroke-width:1;}
.purple{fill:#241E3D;stroke:#8C7DE0;}
.teal{fill:#173829;stroke:#4CAF8C;}
.amber{fill:#3A2A10;stroke:#E0A33D;}
.boxlabel{font-size:13px;font-weight:600;fill:#F5F5F5;}
.boxsub{font-size:11px;fill:#D0D0D0;}
line{stroke:#9CA3AF;stroke-width:1.5;marker-end:url(#arrow);}
</style>
<rect x="0" y="0" width="700" height="420" fill="#0D1117"/>

<rect class="box purple" x="260" y="30" width="160" height="50" rx="8"/>
<text class="boxlabel" x="340" y="49" text-anchor="middle" dominant-baseline="central">Is there a</text>
<text class="boxlabel" x="340" y="65" text-anchor="middle" dominant-baseline="central">network partition?</text>

<line x1="290" y1="80" x2="150" y2="130"/>
<text class="ts" x="190" y="105" text-anchor="middle">Yes (P)</text>
<line x1="390" y1="80" x2="530" y2="130"/>
<text class="ts" x="490" y="105" text-anchor="middle">No — else (E)</text>

<rect class="box amber" x="60" y="130" width="180" height="44" rx="8"/>
<text class="boxlabel" x="150" y="152" text-anchor="middle" dominant-baseline="central">Choose A or C</text>

<line x1="110" y1="174" x2="80" y2="220"/>
<rect class="box teal" x="10" y="220" width="150" height="56" rx="8"/>
<text class="boxlabel" x="85" y="238" text-anchor="middle" dominant-baseline="central">Availability</text>
<text class="boxsub" x="85" y="256" text-anchor="middle" dominant-baseline="central">keep serving, accept</text>
<text class="boxsub" x="85" y="270" text-anchor="middle" dominant-baseline="central">temporary disagreement</text>

<line x1="190" y1="174" x2="220" y2="220"/>
<rect class="box teal" x="160" y="220" width="150" height="56" rx="8"/>
<text class="boxlabel" x="235" y="238" text-anchor="middle" dominant-baseline="central">Consistency</text>
<text class="boxsub" x="235" y="256" text-anchor="middle" dominant-baseline="central">refuse requests you</text>
<text class="boxsub" x="235" y="270" text-anchor="middle" dominant-baseline="central">can't guarantee correct</text>

<rect class="box amber" x="430" y="130" width="180" height="44" rx="8"/>
<text class="boxlabel" x="520" y="152" text-anchor="middle" dominant-baseline="central">Choose L or C</text>

<line x1="480" y1="174" x2="450" y2="220"/>
<rect class="box teal" x="380" y="220" width="150" height="56" rx="8"/>
<text class="boxlabel" x="455" y="238" text-anchor="middle" dominant-baseline="central">Latency</text>
<text class="boxsub" x="455" y="256" text-anchor="middle" dominant-baseline="central">respond fast, accept</text>
<text class="boxsub" x="455" y="270" text-anchor="middle" dominant-baseline="central">some staleness</text>

<line x1="560" y1="174" x2="590" y2="220"/>
<rect class="box teal" x="530" y="220" width="150" height="56" rx="8"/>
<text class="boxlabel" x="605" y="238" text-anchor="middle" dominant-baseline="central">Consistency</text>
<text class="boxsub" x="605" y="256" text-anchor="middle" dominant-baseline="central">wait for quorum,</text>
<text class="boxsub" x="605" y="270" text-anchor="middle" dominant-baseline="central">pay the latency cost</text>

<text class="ts" x="340" y="330" text-anchor="middle">CAP only describes the left branch (rare). PACELC also covers the</text>
<text class="ts" x="340" y="348" text-anchor="middle">right branch — the trade-off you're actually making almost all the time.</text>
</svg>
