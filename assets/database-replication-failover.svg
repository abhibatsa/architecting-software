<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Single-leader replication and failover</title>
<desc>Shows a leader database replicating to two replicas, one synchronous and one asynchronous, then the leader failing and the synchronous replica being promoted to new leader since it has no data loss.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.th{font-size:14px;font-weight:600;}
.ts{font-size:12px;fill:#B4B4B4;}
.box{stroke-width:1;}
.teal{fill:#173829;stroke:#4CAF8C;}
.red{fill:#3A1E1E;stroke:#D97070;}
.purple{fill:#241E3D;stroke:#8C7DE0;}
.amber{fill:#3A2A10;stroke:#E0A33D;}
.boxlabel{font-size:13px;font-weight:600;fill:#F5F5F5;}
.boxsub{font-size:11px;fill:#D0D0D0;}
line{stroke:#9CA3AF;stroke-width:1.5;marker-end:url(#arrow);}
</style>
<rect x="0" y="0" width="680" height="400" fill="#0D1117"/>

<text class="th" x="340" y="28" text-anchor="middle">Before failure</text>
<rect class="box purple" x="270" y="45" width="140" height="50" rx="8"/>
<text class="boxlabel" x="340" y="63" text-anchor="middle" dominant-baseline="central">Leader</text>
<text class="boxsub" x="340" y="79" text-anchor="middle" dominant-baseline="central">accepts writes</text>

<line x1="290" y1="95" x2="150" y2="150"/>
<text class="ts" x="200" y="120" text-anchor="middle">sync</text>
<rect class="box teal" x="60" y="150" width="170" height="50" rx="8"/>
<text class="boxlabel" x="145" y="168" text-anchor="middle" dominant-baseline="central">Replica 1</text>
<text class="boxsub" x="145" y="184" text-anchor="middle" dominant-baseline="central">fully caught up</text>

<line x1="390" y1="95" x2="530" y2="150"/>
<text class="ts" x="480" y="120" text-anchor="middle">async</text>
<rect class="box amber" x="450" y="150" width="170" height="50" rx="8"/>
<text class="boxlabel" x="535" y="168" text-anchor="middle" dominant-baseline="central">Replica 2</text>
<text class="boxsub" x="535" y="184" text-anchor="middle" dominant-baseline="central">slightly behind</text>

<line x1="340" y1="215" x2="340" y2="245" stroke="#D97070" stroke-width="2" marker-end="none"/>
<text class="th" x="340" y="235" text-anchor="middle" fill="#D97070">✕ Leader fails</text>

<text class="th" x="340" y="270" text-anchor="middle">After failover</text>
<rect class="box teal" x="60" y="290" width="170" height="56" rx="8"/>
<text class="boxlabel" x="145" y="308" text-anchor="middle" dominant-baseline="central">Replica 1</text>
<text class="boxsub" x="145" y="324" text-anchor="middle" dominant-baseline="central">promoted — new leader</text>
<text class="boxsub" x="145" y="338" text-anchor="middle" dominant-baseline="central">no data loss (was synced)</text>

<rect class="box red" x="450" y="290" width="170" height="56" rx="8"/>
<text class="boxlabel" x="535" y="308" text-anchor="middle" dominant-baseline="central">Replica 2</text>
<text class="boxsub" x="535" y="324" text-anchor="middle" dominant-baseline="central">its lag = writes lost</text>
<text class="boxsub" x="535" y="338" text-anchor="middle" dominant-baseline="central">if it had been promoted</text>

<text class="ts" x="340" y="380" text-anchor="middle">Which replica is safe to promote depends entirely on how far behind it was — this is the sync/async trade-off made real.</text>
</svg>
