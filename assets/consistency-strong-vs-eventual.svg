<svg width="700" height="420" viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Strong vs eventual vs read-your-own-writes consistency</title>
<desc>Shows three consistency models: strong consistency where the client waits for all replicas to sync before getting a response, eventual consistency where the response is immediate and replicas sync later, and read-your-own-writes where the author sees their change instantly while other readers see it propagate with a delay.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.th{font-size:14px;font-weight:600;}
.ts{font-size:11px;fill:#B4B4B4;}
.box{stroke-width:1;}
.teal{fill:#173829;stroke:#4CAF8C;}
.red{fill:#3A1E1E;stroke:#D97070;}
.purple{fill:#241E3D;stroke:#8C7DE0;}
.amber{fill:#3A2A10;stroke:#E0A33D;}
.boxlabel{font-size:13px;font-weight:600;fill:#F5F5F5;}
.boxsub{font-size:11px;fill:#D0D0D0;}
line{stroke:#9CA3AF;stroke-width:1.5;marker-end:url(#arrow);}
</style>
<rect x="0" y="0" width="700" height="420" fill="#0D1117"/>

<text class="th" x="350" y="26" text-anchor="middle">Strong consistency — wait for all replicas</text>
<rect class="box purple" x="30" y="45" width="120" height="42" rx="8"/>
<text class="boxlabel" x="90" y="66" text-anchor="middle" dominant-baseline="central">Write</text>
<line x1="150" y1="66" x2="220" y2="66"/>
<rect class="box amber" x="220" y="45" width="180" height="42" rx="8"/>
<text class="boxlabel" x="310" y="60" text-anchor="middle" dominant-baseline="central">Sync all replicas</text>
<text class="boxsub" x="310" y="76" text-anchor="middle" dominant-baseline="central">client waits</text>
<line x1="400" y1="66" x2="470" y2="66"/>
<rect class="box teal" x="470" y="45" width="180" height="42" rx="8"/>
<text class="boxlabel" x="560" y="60" text-anchor="middle" dominant-baseline="central">Response</text>
<text class="boxsub" x="560" y="76" text-anchor="middle" dominant-baseline="central">slower, always correct</text>

<line x1="30" y1="105" x2="670" y2="105" stroke="#30363D" stroke-width="1"/>

<text class="th" x="350" y="130" text-anchor="middle">Eventual consistency — respond immediately, sync after</text>
<rect class="box purple" x="30" y="150" width="120" height="42" rx="8"/>
<text class="boxlabel" x="90" y="171" text-anchor="middle" dominant-baseline="central">Write</text>
<line x1="150" y1="171" x2="220" y2="171"/>
<rect class="box teal" x="220" y="150" width="180" height="42" rx="8"/>
<text class="boxlabel" x="310" y="171" text-anchor="middle" dominant-baseline="central">Response — instant</text>
<line x1="150" y1="171" x2="150" y2="215"/>
<line x1="150" y1="215" x2="620" y2="215"/>
<rect class="box red" x="440" y="194" width="200" height="42" rx="8"/>
<text class="boxlabel" x="540" y="209" text-anchor="middle" dominant-baseline="central">Replicas sync</text>
<text class="boxsub" x="540" y="225" text-anchor="middle" dominant-baseline="central">in the background, may lag</text>

<line x1="30" y1="255" x2="670" y2="255" stroke="#30363D" stroke-width="1"/>

<text class="th" x="350" y="280" text-anchor="middle">Read-your-own-writes — the middle ground</text>
<rect class="box purple" x="30" y="300" width="140" height="46" rx="8"/>
<text class="boxlabel" x="100" y="317" text-anchor="middle" dominant-baseline="central">Author writes</text>
<text class="boxsub" x="100" y="333" text-anchor="middle" dominant-baseline="central">then reads</text>
<line x1="170" y1="323" x2="240" y2="323"/>
<rect class="box teal" x="240" y="300" width="170" height="46" rx="8"/>
<text class="boxlabel" x="325" y="317" text-anchor="middle" dominant-baseline="central">Sees it instantly</text>
<text class="boxsub" x="325" y="333" text-anchor="middle" dominant-baseline="central">routed to be consistent for them</text>

<rect class="box amber" x="450" y="300" width="190" height="46" rx="8"/>
<text class="boxlabel" x="545" y="317" text-anchor="middle" dominant-baseline="central">Everyone else</text>
<text class="boxsub" x="545" y="333" text-anchor="middle" dominant-baseline="central">sees it propagate, moment later</text>

<text class="ts" x="350" y="390" text-anchor="middle">The right model is a per-data-type decision, not a whole-system one — see the table below.</text>
</svg>
