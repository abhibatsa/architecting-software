<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Token bucket rate limiting</title>
<desc>Shows a token bucket refilling at a steady rate, with incoming requests consuming tokens; requests are allowed while tokens are available and rejected with a 429 response once the bucket is empty.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.th{font-size:14px;font-weight:600;}
.ts{font-size:12px;fill:#B4B4B4;}
.box{stroke-width:1;}
.teal{fill:#173829;stroke:#4CAF8C;}
.red{fill:#3A1E1E;stroke:#D97070;}
.purple{fill:#241E3D;stroke:#8C7DE0;}
.boxlabel{font-size:14px;font-weight:600;fill:#F5F5F5;}
.boxsub{font-size:12px;fill:#D0D0D0;}
line{stroke:#9CA3AF;stroke-width:1.5;marker-end:url(#arrow);}
</style>
<rect x="0" y="0" width="680" height="340" fill="#0D1117"/>

<text class="th" x="340" y="30" text-anchor="middle">Token bucket</text>

<text class="ts" x="150" y="55" text-anchor="middle">refills steadily</text>
<line x1="150" y1="65" x2="150" y2="95"/>

<rect x="80" y="95" width="140" height="120" rx="10" class="box purple"/>
<circle cx="120" cy="140" r="10" fill="#4CAF8C"/>
<circle cx="150" cy="160" r="10" fill="#4CAF8C"/>
<circle cx="180" cy="140" r="10" fill="#4CAF8C"/>
<circle cx="150" cy="120" r="10" fill="#4CAF8C"/>
<circle cx="120" cy="180" r="10" fill="#4CAF8C"/>
<text class="ts" x="150" y="200" text-anchor="middle">bucket (capacity: 10)</text>

<rect class="box teal" x="260" y="130" width="150" height="46" rx="8"/>
<text class="boxlabel" x="335" y="147" text-anchor="middle" dominant-baseline="central">Request arrives</text>
<text class="boxsub" x="335" y="163" text-anchor="middle" dominant-baseline="central">consume 1 token</text>
<line x1="220" y1="153" x2="260" y2="153"/>

<line x1="410" y1="140" x2="470" y2="90"/>
<rect class="box teal" x="470" y="60" width="170" height="50" rx="8"/>
<text class="boxlabel" x="555" y="78" text-anchor="middle" dominant-baseline="central">Token available</text>
<text class="boxsub" x="555" y="94" text-anchor="middle" dominant-baseline="central">request allowed</text>

<line x1="410" y1="165" x2="470" y2="215"/>
<rect class="box red" x="470" y="190" width="170" height="50" rx="8"/>
<text class="boxlabel" x="555" y="208" text-anchor="middle" dominant-baseline="central">Bucket empty</text>
<text class="boxsub" x="555" y="224" text-anchor="middle" dominant-baseline="central">429 + Retry-After</text>

<text class="ts" x="340" y="290" text-anchor="middle">Short bursts up to bucket capacity are allowed;</text>
<text class="ts" x="340" y="308" text-anchor="middle">the long-run average rate is still enforced by the refill rate.</text>
</svg>
